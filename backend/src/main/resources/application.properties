spring.application.name=harvest-hold-api
server.port=8080
# Listen on all interfaces so phones on LAN can reach the API
server.address=0.0.0.0

spring.datasource.url=jdbc:h2:mem:harvesthold;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true

# Allow React Native / Expo to call the API during development
app.cors.allowed-origins=*
